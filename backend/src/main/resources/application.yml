spring:
  application:
    name: budgetTracker

  config:
    # A local convenience, and only that. Docker Compose reads `.env`
    # automatically; Spring Boot does not, so without this every local run
    # needs the two credentials exported by hand in whatever syntax the current
    # shell happens to want.
    #
    # `optional:` is what makes it harmless everywhere else: a deployed
    # instance has no `.env` and takes its credentials from SSM as real
    # environment variables (ADR-13), so this finds nothing and changes
    # nothing.
    #
    # This does NOT introduce a credential default. With no `.env` and no
    # environment variables, ${DB_USERNAME} below still resolves to nothing and
    # the application still refuses to start. The rule is that there is no
    # fallback *in version control*, and `.env` is gitignored.
    #
    # Both paths, because `spring-boot:run` works from `backend/` while a
    # packaged jar is usually run from the repository root.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    # Credentials come from the environment and have no default on purpose: a
    # fallback password in version control is a credential in version control,
    # and it silently becomes the production one. Startup fails loudly if
    # DB_USERNAME or DB_PASSWORD is unset. Tests never need them — they run on
    # the H2 configuration in src/test/resources/application.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budgettracker}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-4). Hibernate only checks it agrees.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8085
