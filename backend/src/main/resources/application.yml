spring:
  application:
    name: budgetTracker

  datasource:
    # Credentials come from the environment and have no default on purpose: a
    # fallback password in version control is a credential in version control,
    # and it silently becomes the production one. Startup fails loudly if
    # DB_USERNAME or DB_PASSWORD is unset. Tests never need them — they run on
    # the H2 configuration in src/test/resources/application.yml.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budgettracker}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema (ADR-4). Hibernate only checks it agrees.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8085
